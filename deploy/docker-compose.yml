version: "3.9"

services:

  # ── Core: market_feed + supervisor + telegram + dashboard ──
  core:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: trading-core
    env_file: ../.env
    ports:
      - "${DASHBOARD_PORT:-8000}:8000"
    volumes:
      - ../database:/app/database
      - ../data:/app/data
      - ../knowledge_base/strategies:/app/knowledge_base/strategies
      - ../workspaces:/app/workspaces
    restart: unless-stopped
    command: python main.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Trader: jeden kontener = jeden agent ──
  trader:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      - AGENT_ID=${AGENT_ID:-trader_01}
    volumes:
      - ../database:/app/database
      - ../data:/app/data
      - ../knowledge_base/strategies:/app/knowledge_base/strategies
      - ../workspaces:/app/workspaces
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy
    command: python agents/trader.py --id ${AGENT_ID:-trader_01}
    deploy:
      replicas: 3

volumes:
  database:
  data:
  knowledge_base:
